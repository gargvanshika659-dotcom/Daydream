<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff4f7">
<title>daydream ♡ digicam</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700&family=Fredoka:wght@400;500;600&family=Patrick+Hand&display=swap');

:root{
 --pink:#ff9fbd;
 --pink2:#ffd8e5;
 --cream:#fffaf2;
 --ink:#493c3b;
 --shadow:0 12px 35px rgba(120,80,90,.13);
}

*{box-sizing:border-box}

html{scroll-behavior:smooth}

body{
 margin:0;
 color:var(--ink);
 font-family:"Fredoka",sans-serif;
 background:
 radial-gradient(circle at 10% 15%,#ffe2ec 0 35px,transparent 36px),
 radial-gradient(circle at 90% 28%,#e4f4ff 0 45px,transparent 46px),
 linear-gradient(90deg,rgba(255,190,205,.08) 1px,transparent 1px),
 linear-gradient(rgba(255,190,205,.08) 1px,transparent 1px),
 var(--cream);
 background-size:auto,auto,24px 24px,24px 24px;
 overflow-x:hidden;
}

button{
 font:inherit;
 border:0;
 cursor:pointer;
 color:var(--ink);
 -webkit-tap-highlight-color:transparent;
}

img,video,canvas{max-width:100%}

header{
 position:sticky;
 top:0;
 z-index:20;
 backdrop-filter:blur(12px);
 background:rgba(255,250,242,.86);
 border-bottom:1px dashed #efc8d3;
}

.nav{
 max-width:1120px;
 margin:auto;
 padding:13px 18px;
 display:flex;
 align-items:center;
 gap:18px;
}

.logo{
 font-family:"Baloo 2";
 font-weight:700;
 font-size:29px;
}

.logo span:nth-child(1){color:#ff8da8}
.logo span:nth-child(2){color:#ffbe57}
.logo span:nth-child(3){color:#79c98f}
.logo span:nth-child(4){color:#76afea}
.logo span
